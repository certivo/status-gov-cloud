owner: certivo
repo: status-gov-cloud
sites:
  - name: Certivo GovCloud API
    url: https://api.gov-cloud.certivo.com/api/v1/health/livez
secrets: []
skipDeleteIssues: true
status-website:
  cname: status.gov-cloud.certivo.com
  name: Certivo GovCloud Status
  theme: light
  introTitle: "**Certivo GovCloud** service status"
  introMessage: "Service availability and incident updates for Certivo GovCloud."
  navbar:
    - title: Certivo GovCloud Status
      href: /
  css: ':root{color-scheme:light;--body-background-color:#f7f9fc;--body-text-color:#172c42;--card-background-color:#fff;--nav-background-color:#fff;--nav-border-bottom-color:#e4eaf1;--card-border-color:#e4eaf1;--link-color:#246cbd}body{background:#f7f9fc!important;color:#172c42!important;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.65}nav{background:#fff!important;border-bottom:1px solid #e4eaf1!important}nav a{color:#29435d!important;font-weight:600}main.container{max-width:920px;padding-top:32px}header{padding:28px 0 20px}header h1{font-size:clamp(28px,4vw,40px);letter-spacing:-1.4px;line-height:1.2;font-weight:650}header p{color:#61758a;max-width:680px;font-size:16px}h2{font-size:21px;letter-spacing:-.4px}article{border-radius:12px!important;box-shadow:0 2px 8px #10284006;border:1px solid #e1e8f0!important;padding:22px!important}article.up{border-left:4px solid #20a779!important}article.down{border-left:4px solid #dc4657!important}article.degraded{border-left:4px solid #d89a20!important}article.up:not(.graph){background:#eaf8f1!important;color:#176746;font-weight:600;margin:12px 0 36px}.live-status{gap:14px}.live-status article{background-color:#fff!important;margin-bottom:14px;transition:box-shadow .15s,transform .15s}.live-status article:hover{box-shadow:0 6px 20px #17365212;transform:translateY(-1px)}article a{color:#172c42!important}footer{color:#748598!important;font-size:13px;padding:28px 16px}footer a{color:#526e88!important}a:focus-visible{outline:3px solid #4f8be8;outline-offset:4px}@media(max-width:600px){main.container{padding-top:12px}header{padding-top:18px}article{padding:18px!important}}'
i18n:
  footer: "Certivo · Service status powered by [Upptime](https://upptime.js.org)"

